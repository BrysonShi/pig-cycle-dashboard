name: Deploy Pig Cycle Dashboard

on:
  # 每日北京时间09:00（UTC 01:00）自动触发 — 部署
  schedule:
    - cron: '0 1 * * *'
  # 支持手动触发（GitHub Actions 页面可操作）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: 企微预警推送
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: data-check

      - name: 读取 latest.json + 判断预警等级
        id: alert
        run: |
          # 读取 alert_level（若 latest.json 里有该字段）
          LEVEL=$(python3 -c "
          import json
          try:
              with open('data-check/data/latest.json','r',encoding='utf-8') as f:
                  d = json.load(f)
              level = d.get('alert_level', {}).get('level', 'green')
              msg = d.get('alert_level', {}).get('message', '数据已更新')
              print(f'{level}|{msg}')
          except Exception as e:
              print(f'green|读取失败: {e}')
          ")
          ALERT_LEVEL=$(echo "$LEVEL" | cut -d'|' -f1)
          ALERT_MSG=$(echo "$LEVEL" | cut -d'|' -f2)
          echo "alert_level=$ALERT_LEVEL" >> $GITHUB_OUTPUT
          echo "alert_msg=$ALERT_MSG" >> $GITHUB_OUTPUT
          echo "🚨 预警等级: $ALERT_LEVEL"
          echo "📝 消息: $ALERT_MSG"

      - name: 推送企微（红/黄色预警时）
        if: steps.alert.outputs.alert_level == 'red' || steps.alert.outputs.alert_level == 'yellow'
        env:
          WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK }}
          ALERT_LEVEL: ${{ steps.alert.outputs.alert_level }}
          ALERT_MSG: ${{ steps.alert.outputs.alert_msg }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ WEWORK_WEBHOOK 未配置，跳过推送"
            exit 0
          fi

          if [ "$ALERT_LEVEL" == "red" ]; then
            ICON="🚨"
          else
            ICON="⚠️"
          fi
          export ICON  # 透传给下面的 python3 子进程

          # 用 Python 拼 JSON body，bash 不再处理转义嵌套
          BODY=$(python3 - <<'PY'
          import os, json
          from datetime import datetime
          content = (
              f"{os.environ['ICON']} **生猪周期{os.environ['ALERT_LEVEL']}预警**\n"
              f"> 触发时间: {datetime.now().strftime('%Y-%m-%d %H:%M')}\n"
              f"> {os.environ['ALERT_MSG']}\n"
              f"> \n"
              f"> **查看看板：** https://brysonshi.github.io/pig-cycle-dashboard/\n"
              f"> \n"
              f"> _GitHub Actions 自动推送_"
          )
          print(json.dumps({"msgtype": "markdown", "markdown": {"content": content}}, ensure_ascii=False))
          PY
          )

          echo "📤 推送 body:"
          echo "$BODY"
          RESP=$(curl -s -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$BODY")
          echo "📥 企微响应: $RESP"
          echo "$RESP" | grep -q '"errcode":0' || { echo "❌ 企微返回非 0 错误"; exit 1; }
