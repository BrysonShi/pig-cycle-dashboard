name: Deploy Pig Cycle Dashboard

on:
  # 每日北京时间09:00（UTC 01:00）自动触发 — 部署
  schedule:
    - cron: '0 1 * * *'
  # 支持手动触发（GitHub Actions 页面可操作）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: 企微预警推送
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: data-check

      - name: 读取 latest.json + 判断预警等级
        id: alert
        run: |
          # 读取 alert_level（若 latest.json 里有该字段）
          LEVEL=$(python3 -c "
          import json
          try:
              with open('data-check/data/latest.json','r',encoding='utf-8') as f:
                  d = json.load(f)
              level = d.get('alert_level', {}).get('level', 'green')
              msg = d.get('alert_level', {}).get('message', '数据已更新')
              print(f'{level}|{msg}')
          except Exception as e:
              print(f'green|读取失败: {e}')
          ")
          ALERT_LEVEL=$(echo "$LEVEL" | cut -d'|' -f1)
          ALERT_MSG=$(echo "$LEVEL" | cut -d'|' -f2)
          echo "alert_level=$ALERT_LEVEL" >> $GITHUB_OUTPUT
          echo "alert_msg=$ALERT_MSG" >> $GITHUB_OUTPUT
          echo "🚨 预警等级: $ALERT_LEVEL"
          echo "📝 消息: $ALERT_MSG"

      - name: 推送企微（红/黄色预警时）
        if: steps.alert.outputs.alert_level == 'red' || steps.alert.outputs.alert_level == 'yellow'
        env:
          WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK }}
          ALERT_LEVEL: ${{ steps.alert.outputs.alert_level }}
          ALERT_MSG: ${{ steps.alert.outputs.alert_msg }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ WEWORK_WEBHOOK 未配置，跳过推送"
            exit 0
          fi

          ICON="🚨"
          [ "$ALERT_LEVEL" == "yellow" ] && ICON="⚠️"

          curl -s -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"${ICON} **生猪周期${ALERT_LEVEL}预警**\\n> 触发时间: \$(date '+%Y-%m-%d %H:%M')\\n> ${ALERT_MSG}\\n> \\n> **查看看板：** https://brysonshi.github.io/pig-cycle-dashboard/\\n> \\n> _GitHub Actions 自动推送_\"
              }
            }"
